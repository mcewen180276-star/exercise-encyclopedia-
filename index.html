const KEY='exercise-library-pro-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{};if(!db||!Array.isArray(db.exercises))db={exercises:SEED.exercises,customEquipment:[],customMethods:[],collection:[],settings:{title:'My Exercise Guide',client:'',notes:'',format:'detailed',links:true}};
db.settings={title:'My Exercise Guide',client:'',notes:'',format:'detailed',links:true,...db.settings};db.customEquipment ||= [];db.customMethods ||= [];db.collection ||= [];
let tab='home',filters={q:'',equipment:'',method:'',area:''},limit=60,editing=null;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Storage full or unavailable. Export a backup now.')}}
function equipList(){return [...new Set([...Object.values(SEED.equipmentGroups).flat(),...db.customEquipment,...db.exercises.map(x=>x.equipment)])].sort()}
function methodList(){return [...new Set([...Object.values(SEED.methodGroups).flat(),...db.customMethods,...db.exercises.map(x=>x.method)])].sort()}
function opt(vals,chosen,empty='All'){return `<option value="">${esc(empty)}</option>`+vals.map(v=>`<option value="${esc(v)}" ${v===chosen?'selected':''}>${esc(v)}</option>`).join('')}
function lookupUrl(term,kind='exercise'){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(term+' '+(kind==='exercise'?'exercise technique demonstration':'fitness equipment how to use'))}
function safeLink(url){try{let u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function infoLink(x){return safeLink(x.link)||lookupUrl(x.name)}
function guideInfo(m){if(/heart rate zones|zone 2/i.test(m))return 'Heart-rate zones describe exercise intensity as a percentage of estimated maximum heart rate or heart-rate reserve. Estimates vary between individuals; perceived exertion and the talk test are useful alternatives. Easy effort usually allows conversation; vigorous effort makes talking harder.';if(/hypertrophy|bodybuilding/i.test(m))return 'Hypertrophy training aims to develop muscle size through appropriately challenging resistance work. Choose a manageable load, controlled technique and enough recovery. Repetitions, sets and rest vary with experience and goals.';if(/strength|progressive overload/i.test(m))return 'Strength training develops the ability to produce force. A set is a group of repetitions; repetitions are individual movements. Progressive overload means increasing demands gradually over time while maintaining technique.';if(/hiit|interval|tabata|emom|amrap|circuit/i.test(m))return 'Intervals alternate work and recovery. EMOM means every minute on the minute; AMRAP means as many rounds or repetitions as reasonably possible in a set time. Choose work, rest and intensity to suit the participant.';if(/pilates/i.test(m))return 'Pilates emphasises controlled movement, breathing, posture, trunk stability and coordination. Modify range and resistance to suit the person and avoid forcing painful positions.';if(/yoga|stretch|mobility/i.test(m))return 'Mobility and flexibility work use comfortable controlled ranges. Dynamic stretching moves through range; static stretching holds a position. Avoid forcing a stretch or holding the breath.';if(/senior|chair|balance|low impact/i.test(m))return 'Adapt exercises to balance, comfort, confidence and current ability. Use stable support, clear floors and lower-impact options where useful. Age alone does not determine fitness level.';if(/cardio|steady|tempo|fartlek/i.test(m))return 'Cardiovascular training uses sustained or varied activity to challenge the heart and lungs. Intensity can be guided by the talk test, heart rate and perceived exertion; duration and recovery depend on goals.';return `${m} is a training approach. Select exercises appropriate to the person, their goals and equipment, and adjust intensity, technique, volume and recovery as needed.`}
function equipInfo(e){return `${e} can be used in exercise sessions where appropriate. Check setup, stability, wear and manufacturer guidance before use. Choose suitable resistance, adjust contact points and maintain a clear training space.`}
function navRender(){let tabs=[['home','Dashboard'],['exercises','Exercises'],['equipment','Equipment'],['methods','Training methods'],['builder','Client guide'],['manage','Add & backup']];$('#nav').innerHTML=tabs.map(([id,name])=>`<button class="${tab===id?'active':'secondary'}" onclick="go('${id}')">${name}${id==='builder'?' ('+db.collection.length+')':''}</button>`).join('');$('#topCount').textContent=db.exercises.length+' exercises'}
function go(t){tab=t;render();window.scrollTo({top:0,behavior:'instant'})}function render(){navRender();$('#app').innerHTML=({home:homePage,exercises:exercisePage,equipment:equipmentPage,methods:methodPage,builder:builderPage,manage:managePage})[tab]();}
function homePage(){return `<div class="panel"><h2>Your complete exercise reference</h2><p>Search exercises by equipment, training style or body area. Save your selections to a client guide, then print or save as a PDF with working links.</p><div class="grid"><div class="stat"><strong>${db.exercises.length}</strong>Exercises</div><div class="stat"><strong>${equipList().length}</strong>Equipment types</div><div class="stat"><strong>${methodList().length}</strong>Training methods</div><div class="stat"><strong>${db.collection.length}</strong>In client guide</div></div><p class="row"><button onclick="go('exercises')">Browse exercises</button><button class="secondary" onclick="go('builder')">Build client PDF</button></p></div><div class="panel"><h3>Quick start</h3><p>1. Browse and filter exercises. 2. Select <b>+ Add to guide</b>. 3. Open Client guide, set your client details and print to PDF or export a shareable HTML guide.</p><div class="notice">Exercise instructions are educational summaries, not individual medical advice. Built-in demonstration buttons open a targeted video search rather than a verified specific video. You can add direct verified links to your own entries.</div></div>`}
function exercisePage(){let es=db.exercises.filter(x=>(!filters.q||[x.name,x.instructions,x.equipment,x.method,x.area].join(' ').toLowerCase().includes(filters.q.toLowerCase()))&&(!filters.equipment||x.equipment===filters.equipment)&&(!filters.method||x.method===filters.method)&&(!filters.area||x.area===filters.area));return `<div class="panel"><h2>Exercise finder</h2><div class="filters"><div><label>Search name or description</label><input id="q" placeholder="e.g. squat, bridge, row" value="${esc(filters.q)}" oninput="updateFilters()"></div><div><label>Equipment</label><select id="fe" onchange="updateFilters()">${opt(equipList(),filters.equipment)}</select></div><div><label>Training type</label><select id="fm" onchange="updateFilters()">${opt(methodList(),filters.method)}</select></div><div><label>Body area</label><select id="fa" onchange="updateFilters()">${opt([...new Set(db.exercises.map(x=>x.area))].sort(),filters.area)}</select></div></div><p class="row between"><span class="counter">${es.length} matching exercises</span><button class="secondary" onclick="clearFilters()">Clear filters</button></p></div><div class="cards">${es.slice(0,limit).map(exerciseCard).join('')}</div>${es.length>limit?`<div class="panel"><button onclick="limit+=60;render()">Load more (${es.length-limit} remaining)</button></div>`:''}${!es.length?'<div class="empty">No matches. Try clearing a filter or add your own exercise.</div>':''}`}
function updateFilters(){filters={q:$('#q').value,equipment:$('#fe').value,method:$('#fm').value,area:$('#fa').value};limit=60;let el=document.activeElement,id=el?.id,at=el?.selectionStart;render();if(id==='q'){let q=$('#q');q.focus();q.setSelectionRange(at,at)}}function clearFilters(){filters={q:'',equipment:'',method:'',area:''};render()}
function exerciseCard(x){let inGuide=db.collection.includes(x.id);return `<article class="item"><h3>${esc(x.name)}</h3><div><span class="tag">${esc(x.equipment)}</span><span class="tag">${esc(x.method)}</span><span class="tag">${esc(x.area)}</span></div><p class="small">${esc(x.instructions)}</p><details><summary>Technique & variations</summary><p class="small"><b>Easier:</b> ${esc(x.easier)}</p><p class="small"><b>Progression:</b> ${esc(x.harder)}</p><p class="small"><b>Programming:</b> Choose suitable sets, reps or duration and rest based on ability and training goal.</p><p><a href="${esc(infoLink(x))}" target="_blank" rel="noopener">${x.link?'Open demonstration':'Find demonstration videos'} ↗</a></p></details><div class="actions"><button onclick="toggleGuide('${x.id}')" class="${inGuide?'secondary':''}">${inGuide?'✓ In guide · Remove':'+ Add to guide'}</button>${x.source==='Custom'?`<button class="secondary" onclick="editExercise('${x.id}')">Edit</button>`:''}</div></article>`}
function toggleGuide(id){let i=db.collection.indexOf(id);if(i<0)db.collection.push(id);else db.collection.splice(i,1);save();render()}
function equipmentPage(){let q=window.eqQuery||'';let es=equipList().filter(x=>x.toLowerCase().includes(q.toLowerCase()));return `<div class="panel"><h2>Equipment encyclopedia</h2><p class="muted">${equipList().length} equipment types, including bodyweight. Open a guide for basic use, relevant exercises and demonstration search.</p><input placeholder="Search equipment..." value="${esc(q)}" oninput="window.eqQuery=this.value;render();document.activeElement.blur()"></div><div class="cards">${es.map(e=>`<article class="item"><h3>${esc(e)}</h3><p class="small">${esc(equipInfo(e))}</p><p class="muted">${db.exercises.filter(x=>x.equipment===e).length} linked exercises</p><details><summary>Equipment guidance & links</summary><p class="small">${esc(equipInfo(e))}</p><a href="${esc(lookupUrl(e,'equipment'))}" target="_blank" rel="noopener">Find equipment demonstrations ↗</a></details><div class="actions"><button onclick="filters={q:'',equipment:${JSON.stringify(e)},method:'',area:''};go('exercises')">See exercises</button></div></article>`).join('')}</div>`}
function methodPage(){let q=window.methodQuery||'';return `<div class="panel"><h2>Training methods encyclopedia</h2><p>Browse ${methodList().length} styles of training. Each entry explains key concepts and links to related exercises.</p><input placeholder="Search methods..." value="${esc(q)}" oninput="window.methodQuery=this.value;render();document.activeElement.blur()"></div><div class="cards">${methodList().filter(x=>x.toLowerCase().includes(q.toLowerCase())).map(m=>`<article class="item"><h3>${esc(m)}</h3><p class="small">${esc(guideInfo(m))}</p><details><summary>Key programming terms</summary><p class="small"><b>Reps:</b> repetitions of a movement. <b>Sets:</b> groups of repetitions. <b>Rest:</b> recovery between efforts. <b>Tempo:</b> movement speed. <b>RPE:</b> perceived effort, commonly on a 0–10 scale.</p><a target="_blank" rel="noopener" href="${esc('https://www.google.com/search?q='+encodeURIComponent(m+' fitness training explanation'))}">Research this method ↗</a></details><button onclick="filters={q:'',equipment:'',method:${JSON.stringify(m)},area:''};go('exercises')">Find exercises</button></article>`).join('')}</div>`}
function builderPage(){let selected=db.collection.map(id=>db.exercises.find(x=>x.id===id)).filter(Boolean);return `<div class="panel"><h2>Client PDF & guide builder</h2><div class="filters"><div><label>Guide title</label><input id="btitle" value="${esc(db.settings.title)}" oninput="setSetting('title',this.value)"></div><div><label>Client name (optional)</label><input id="bclient" value="${esc(db.settings.client)}" oninput="setSetting('client',this.value)"></div><div><label>Print style</label><select id="bformat" onchange="setSetting('format',this.value)"><option value="detailed" ${db.settings.format==='detailed'?'selected':''}>Detailed client guide</option><option value="compact" ${db.settings.format==='compact'?'selected':''}>Compact cheat sheet</option><option value="programme" ${db.settings.format==='programme'?'selected':''}>Programme with sets & reps</option></select></div></div><label>Instructions / coach notes</label><textarea id="bnotes" oninput="setSetting('notes',this.value)" placeholder="General guidance, goals, frequency...">${esc(db.settings.notes)}</textarea><label><input type="checkbox" ${db.settings.links?'checked':''} onchange="setSetting('links',this.checked)"> Include clickable demonstration and equipment links</label><div class="row" style="margin-top:14px"><button onclick="printGuide()">🖨 Print / Save PDF</button><button onclick="exportClient()">↗ Export client HTML</button><button class="secondary" onclick="go('exercises')">+ Find exercises</button><button class="danger" onclick="clearGuide()">Clear guide</button></div><p class="hint">On Android or Windows choose <b>Save as PDF</b> in the print dialog. Export client HTML creates a separate mobile-friendly guide you can share as a file. Links in PDF generally remain clickable when printed to PDF by modern browsers.</p></div><div class="panel"><h3>Selected exercises (${selected.length})</h3>${selected.length?selected.map((x,i)=>`<div class="guide"><div class="row between"><b>${i+1}. ${esc(x.name)}</b><div class="row"><button class="secondary compact" ${i===0?'disabled':''} onclick="moveGuide(${i},-1)">↑</button><button class="secondary compact" ${i===selected.length-1?'disabled':''} onclick="moveGuide(${i},1)">↓</button><button class="danger compact" onclick="toggleGuide('${x.id}')">Remove</button></div></div><div class="muted">${esc(x.equipment)} · ${esc(x.method)} · ${esc(x.area)}</div><p class="small">${esc(x.instructions)}</p><div class="filters"><div><label>Sets / rounds</label><input id="sets-${x.id}" placeholder="e.g. 3" value="${esc((db.program||{})[x.id]?.sets||'')}" onchange="programSet('${x.id}','sets',this.value)"></div><div><label>Reps / time</label><input id="reps-${x.id}" placeholder="e.g. 10 or 30 sec" value="${esc((db.program||{})[x.id]?.reps||'')}" onchange="programSet('${x.id}','reps',this.value)"></div><div><label>Rest</label><input id="rest-${x.id}" placeholder="e.g. 45 sec" value="${esc((db.program||{})[x.id]?.rest||'')}" onchange="programSet('${x.id}','rest',this.value)"></div></div></div>`).join(''):'<div class="empty">No exercises yet. Go to Exercises and add some.</div>'}</div>`}
function setSetting(k,v){db.settings[k]=v;save()}function programSet(id,k,v){db.program||={};db.program[id]||={};db.program[id][k]=v;save()}function moveGuide(i,step){let j=i+step;[db.collection[i],db.collection[j]]=[db.collection[j],db.collection[i]];save();render()}function clearGuide(){if(confirm('Remove all exercises from this guide?')){db.collection=[];save();render()}}
function guideMarkup(forClient=false){let s=db.settings;let selected=db.collection.map(id=>db.exercises.find(x=>x.id===id)).filter(Boolean);let format=s.format;return `<div class="print-header"><h1>${esc(s.title||'Exercise Guide')}</h1>${s.client?`<p><b>Prepared for:</b> ${esc(s.client)}</p>`:''}${s.notes?`<p>${esc(s.notes).replace(/\n/g,'<br>')}</p>`:''}<p class="muted">${selected.length} exercises · ${new Date().toLocaleDateString('en-GB')}</p></div>${selected.map((x,i)=>{let p=(db.program||{})[x.id]||{};return `<section class="guide"><h3>${i+1}. ${esc(x.name)}</h3><p class="small"><b>Equipment:</b> ${esc(x.equipment)} · <b>Type:</b> ${esc(x.method)} · <b>Focus:</b> ${esc(x.area)}</p>${format==='programme'?`<p><b>Sets:</b> ${esc(p.sets||'—')} · <b>Reps/time:</b> ${esc(p.reps||'—')} · <b>Rest:</b> ${esc(p.rest||'—')}</p>`:''}${format!=='compact'?`<p><b>How to:</b> ${esc(x.instructions)}</p><p><b>Easier:</b> ${esc(x.easier)} <b>Progression:</b> ${esc(x.harder)}</p>`:''}${s.links?`<p><a href="${esc(infoLink(x))}">${x.link?'Exercise demonstration':'Search for exercise demonstration'}</a> · <a href="${esc(lookupUrl(x.equipment,'equipment'))}">Equipment guidance</a></p>`:''}</section>`}).join('')}<p style="font-size:.8em;margin-top:20px">Educational guidance only. Exercise selection and intensity should suit individual ability and health circumstances. Video search results are not individually verified.</p>`}
function printGuide(){if(!db.collection.length)return alert('Add exercises to the guide first.');$('#printSheet').innerHTML=guideMarkup();window.print()}
function download(name,content,type){let b=new Blob([content],{type});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function exportClient(){if(!db.collection.length)return alert('Add exercises first.');let style=`body{font-family:system-ui,Arial,sans-serif;max-width:760px;margin:20px auto;padding:16px;color:#19334b;line-height:1.5}.guide{border-bottom:1px solid #dce5ef;padding:15px 0}h1{color:#123d62}a{color:#1762a2}p{margin:7px 0}.muted{color:#60778a}`;let content=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(db.settings.title)}</title><style>${style}</style></head><body>${guideMarkup(true)}</body></html>`;download('client-exercise-guide.html',content,'text/html')}
function managePage(){return `<div class="panel"><h2>Add your own exercise</h2><p class="muted">Add exercises and a verified demonstration URL if you have one. Changes are saved on this device.</p><div class="filters"><div><label>Exercise name</label><input id="aname" placeholder="e.g. Seated band press"></div><div><label>Equipment</label><input id="aequip" list="equipD" placeholder="Choose or enter new equipment"><datalist id="equipD">${equipList().map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div><div><label>Training type</label><input id="amethod" list="methodD" placeholder="Choose or enter new method"><datalist id="methodD">${methodList().map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div><div><label>Body area</label><select id="aarea">${opt(['Full Body','Upper Body','Lower Body','Core','Cardio','Chest','Back','Shoulders','Arms','Glutes','Balance','Mobility','Recovery'],'Full Body')}</select></div></div><label>Step-by-step instructions</label><textarea id="ainstructions"></textarea><div class="filters"><div><label>Easier option</label><input id="aeasier"></div><div><label>Progression</label><input id="aharder"></div></div><label>Direct demonstration URL (optional)</label><input id="alink" type="url" placeholder="https://..."><p><button onclick="addExercise()">Save exercise</button></p></div><div class="panel"><h2>Add equipment or training method</h2><div class="filters"><div><label>New equipment</label><input id="newEquip" placeholder="Equipment name"><button style="margin-top:8px" onclick="addTerm('equipment')">Add equipment</button></div><div><label>New training method</label><input id="newMethod" placeholder="Training method name"><button style="margin-top:8px" onclick="addTerm('method')">Add method</button></div></div><p class="hint">New terms appear in filters immediately. Add matching exercises separately. Online research links are available in their encyclopedia entries.</p></div><div class="panel"><h2>Data backup & restore</h2><p>All data is stored in this browser on this device. Export a backup before clearing browser data or changing devices.</p><div class="row"><button onclick="backup()">Download full JSON backup</button><button class="secondary" onclick="$('#restore').click()">Restore JSON backup</button><input id="restore" class="hidden" type="file" accept=".json,application/json" onchange="restoreFile(this.files[0])"></div><p class="hint">Restoring replaces the current library and guide on this device. Your backups are plain JSON files.</p></div><div class="panel"><h3>Custom exercises (${db.exercises.filter(x=>x.source==='Custom').length})</h3>${db.exercises.filter(x=>x.source==='Custom').map(x=>`<p>${esc(x.name)} <button class="secondary compact" onclick="editExercise('${x.id}')">Edit</button> <button class="danger compact" onclick="deleteExercise('${x.id}')">Delete</button></p>`).join('')||'<p class="muted">None yet</p>'}</div>`}
function addTerm(t){let field=$(t==='equipment'?'#newEquip':'#newMethod'),value=field.value.trim();if(!value)return alert('Enter a name');let list=t==='equipment'?db.customEquipment:db.customMethods;if(!list.includes(value))list.push(value);save();render();alert('Added '+value)}
function addExercise(){let val=id=>$('#'+id).value.trim(),name=val('aname'),equipment=val('aequip'),method=val('amethod'),instructions=val('ainstructions');if(!name||!equipment||!method||!instructions)return alert('Name, equipment, method and instructions are required.');let link=val('alink');if(link&&!safeLink(link))return alert('Please enter a valid http or https URL.');let item={id:editing||'custom-'+Date.now(),name,equipment,method,area:val('aarea')||'Full Body',instructions,easier:val('aeasier')||'Reduce range or load.',harder:val('aharder')||'Progress gradually.',link,source:'Custom'};let i=db.exercises.findIndex(x=>x.id===item.id);if(i>=0)db.exercises[i]=item;else db.exercises.push(item);editing=null;save();render();alert('Exercise saved')}
function editExercise(id){let x=db.exercises.find(x=>x.id===id);if(!x||x.source!=='Custom')return;editing=id;go('manage');let fields={aname:x.name,aequip:x.equipment,amethod:x.method,aarea:x.area,ainstructions:x.instructions,aeasier:x.easier,aharder:x.harder,alink:x.link||''};for(let [k,v]of Object.entries(fields))$('#'+k).value=v;window.scrollTo(0,0)}
function deleteExercise(id){if(!confirm('Delete this custom exercise?'))return;db.exercises=db.exercises.filter(x=>x.id!==id);db.collection=db.collection.filter(x=>x!==id);save();render()}
function backup(){download('exercise-library-pro-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json')}
async function restoreFile(file){if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.exercises)||!Array.isArray(d.collection)||!d.settings)throw Error('Invalid backup');if(!confirm('Replace your current data with this backup?'))return;db=d;db.customEquipment||=[];db.customMethods||=[];db.program||={};save();render();alert('Backup restored')}catch(e){alert('Could not restore: '+e.message)}}
render();</script></body></html>
